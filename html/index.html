<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ta-radio</title>
    <link rel="stylesheet" href="device-layout.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 右上寄りの一覧。無線に入っている間だけ出る -->
    <div class="hud-layer">
        <aside id="hud" class="hud" aria-live="polite" hidden>
            <header class="hud-head">
                <div class="hud-channel">
                    <span class="hud-label">無線番号</span>
                    <span id="hudChannel" class="hud-figure"></span>
                </div>
                <span id="hudCount" class="hud-count"></span>
            </header>
            <ul id="hudList" class="hud-list"></ul>
            <p id="hudMore" class="hud-more" hidden></p>
        </aside>
    </div>

    <!-- アイテムを使うと右下から出てくる無線機。液晶で表示名と無線番号を入れ、下の 3 つのボタンで操作する -->
    <div id="device" class="device" hidden>
        <div class="device-body">
            <img class="device-img" src="img/radio-device.png" alt="" draggable="false">

            <form id="lcd" class="lcd" autocomplete="off" novalidate>
                <div class="lcd-top">
                    <span class="lcd-sig" aria-hidden="true"><i></i><i></i><i></i></span>
                    <span id="lcdState" class="lcd-state"></span>
                    <span class="lcd-ch">CH</span>
                </div>
                <input id="channelInput" class="lcd-channel" type="text" inputmode="decimal" spellcheck="false" aria-label="無線番号">
                <label class="lcd-name">
                    <span class="lcd-label">名前</span>
                    <input id="nameInput" class="lcd-name-input" type="text" spellcheck="false" aria-label="表示名">
                    <span id="nameCount" class="lcd-count"></span>
                </label>
                <p id="lcdMsg" class="lcd-msg" role="alert"></p>
                <div class="lcd-soft" aria-hidden="true">
                    <span id="soft1"></span>
                    <span>閉じる</span>
                    <span>合わせる</span>
                </div>
                <button type="submit" hidden></button>
            </form>

            <button id="key1" class="key key1" type="button" aria-label="抜ける"></button>
            <button id="key2" class="key key2" type="button" aria-label="閉じる"></button>
            <button id="key3" class="key key3" type="button" aria-label="合わせる"></button>

            <div class="device-hint">
                <span class="hint"><kbd id="talkKey"></kbd>押している間だけ送信</span>
                <span class="hint"><kbd>Enter</kbd>合わせる</span>
                <span class="hint"><kbd>Esc</kbd>閉じる</span>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
